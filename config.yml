# Galaxy arms represent your core focus areas.
# "weight" sizes each arm's radar sector proportionally (defaults to 1
# if omitted); it's an honest signal of emphasis, not just a fixed
# equal split of the circle.
galaxy_arms:
  - name: "AI Systems"
    color: "synapse_cyan"
    weight: 4
    items:
      - "RAG"
      - "LLM Evaluation"
      - "Agent Orchestration"
  - name: "Game Development"
    color: "dendrite_violet"
    weight: 3
    items:
      - "Gameplay Systems"
      - "3D Pipelines"
      - "Engine Tooling"
  - name: "Product & Delivery"
    color: "axon_amber"
    weight: 3
    items:
      - "Agile"
      - "Retention Analytics"
      - "CI/CD"

# Featured projects shown as constellation stars
projects:
  - repo: "ogtknscn/rag-eval-kit"
    arm: 0
    description: "Scores RAG pipeline outputs for context grounding and relevancy."
  - repo: "ogtknscn/agentmesh"
    arm: 0
    description: "Domain-agnostic multi-agent orchestration kit: apex orchestrator, specialist personas, keyword routing, 3-tier RAG priority ladder."

# Theme color overrides (optional, defaults to deep space palette)
theme:
  void: "#080c14"
  nebula: "#0f1623"
  star_dust: "#1a2332"
  synapse_cyan: "#00d4ff"
  dendrite_violet: "#a78bfa"
  axon_amber: "#ffb020"
  text_bright: "#f1f5f9"
  text_dim: "#94a3b8"
  text_faint: "#64748b"

# Stats configuration
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8
