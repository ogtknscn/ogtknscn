      - "Unity"
      - "C#"
      - "Python"
  - name: "Backend"
    color: "synapse_cyan"
    items:
      - "Python"
      - "FastAPI"
      - "LanceDB"
  - name: "DevOps"
    color: "axon_amber"
    items:
      - "Git"
      - "GitHub Actions"
      - "Docker"

# Featured projects shown as constellation stars
projects:
  - repo: "ogtknscn/gdd-tool"
    arm: 0
    description: "Offline-first visual Game Design Document workspace built with Tauri and React."
  - repo: "ogtknscn/viam-site"
    arm: 1
    description: "Website for the Hi Games Viam studio."

# Theme color overrides (optional, defaults to deep space palette)
theme:
  void: "#080c14"
  nebula: "#0f1623"
  star_dust: "#1a2332"
  synapse_cyan: "#00d4ff"
  dendrite_violet: "#a78bfa"
  axon_amber: "#ffb020"
  text_bright: "#f1f5f9"
  text_dim: "#94a3b8"
  text_faint: "#64748b"

# Stats configuration
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8
