# Profile information displayed in the galaxy header
profile:
  name: "Sezai Can Ogutken"
  tagline: "Product Manager & Game Studio Founder"
  company: "Hi Games Viam"
  location: "Turkey"
  bio: |
    Product Manager with a Computer Engineering background, started out
